name: ST Print 24/7 Cloud Sync

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install openpyxl
        run: pip install openpyxl

      - name: Sync Google Sheets and build cloud_state.b64
        run: python server.py --cloud-build

      - name: Commit and push updated cloud_state.b64
        run: |
          git config user.name "ST Print Cloud Bot"
          git config user.email "bot@stprint.org"
          git add cloud_state.b64
          git diff --staged --quiet || (git commit -m "Auto-sync cloud_state.b64 [skip ci]" && git push)
