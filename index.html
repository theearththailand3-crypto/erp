<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ST Print ERP & Backoffice — กำลังเข้าสู่ระบบ</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0b1120; color:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  .card { background:#151f32; border:1px solid #263554; border-radius:16px; padding:28px 24px; max-width:400px; width:90%; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.45); }
  .spin { width:40px; height:40px; border:3px solid #334155; border-top-color:#38bdf8; border-radius:50%; margin:0 auto 16px; animation:s .8s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
  h1 { font-size:18px; margin:0 0 8px; color:#f8fafc; }
  p { font-size:13px; color:#94a3b8; margin:0 0 18px; line-height:1.5; }
  .btns { display:flex; flex-direction:column; gap:8px; }
  a.btn { display:block; padding:10px 14px; border-radius:10px; text-decoration:none; font-weight:600; font-size:13px; }
  a.primary { background:#2563eb; color:#fff; }
  a.secondary { background:#1e293b; color:#cbd5e1; border:1px solid #334155; }
</style>
</head>
<body>
<div class="card">
  <div class="spin"></div>
  <h1>ST Print ERP & Backoffice</h1>
  <p id="msg">กำลังเชื่อมต่อไปยังเซิร์ฟเวอร์ร้านแบบอัตโนมัติ...</p>
  <div class="btns" id="btns" style="display:none">
    <a id="btnTunnel" class="btn primary" href="#">🌐 เข้าผ่านลิงก์ออนไลน์ (4G/5G/นอกร้าน)</a>
    <a id="btnLan" class="btn secondary" href="#">📶 เข้าผ่าน Wi-Fi ในร้าน</a>
  </div>
</div>
<script>
(async function(){
  const qs = window.location.search + window.location.hash;
  let data = null;
  try {
    const r = await fetch('https://api.github.com/repos/theearththailand3-crypto/erp/contents/live.json?t=' + Date.now(), {cache:'no-store'});
    if (r.ok) {
      const j = await r.json();
      if (j && j.content) {
        data = JSON.parse(atob(j.content.replace(/\s/g, '')));
      }
    }
  } catch(e) {}
  if (!data) {
    try {
      const r2 = await fetch('./live.json?t=' + Date.now(), {cache:'no-store'});
      if (r2.ok) data = await r2.json();
    } catch(e) {}
  }
  if (data && data.url) {
    const target = data.url.replace(/\/$/, '') + '/' + (qs.startsWith('/') ? qs.slice(1) : qs);
    const lan = (data.lan || 'http://192.168.1.129:3580').replace(/\/$/, '') + '/' + (qs.startsWith('/') ? qs.slice(1) : qs);
    document.getElementById('btnTunnel').href = target;
    document.getElementById('btnLan').href = lan;
    document.getElementById('btns').style.display = 'flex';
    window.location.replace(target);
  } else {
    document.getElementById('msg').textContent = 'ยังไม่ได้รับสัญญาณจากเครื่องเซิร์ฟเวอร์หลัก กรุณาตรวจสอบว่าเปิดเครื่องหลักอยู่';
  }
})();
</script>
</body>
</html>
